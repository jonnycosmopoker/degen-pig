name = "degen-pig"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Supabase sign-in. Both values are public by design; the secret key, if added, goes in as a Cloudflare secret (SUPABASE_SECRET).
[vars]
SUPABASE_URL = "https://fdaysgypgzyexilqfyrx.supabase.co"
SUPABASE_KEY = "sb_publishable_GAe1m_PFF3WV_Cp2vv5h-A_ca3ANUms"
# Google accounts allowed to open the stats page at /admin (comma-separated)
ADMIN_EMAILS = "jonnycosmopoker@gmail.com"

# The game page, pictures and badges. Requests that match no file go to the worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "TABLE"
class_name = "Table"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Table", "Lobby", "Accounts"]
