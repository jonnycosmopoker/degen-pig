name = "degen-pig"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Supabase sign-in. Both values are public by design; the secret key, if added, goes in as a Cloudflare secret (SUPABASE_SECRET).
[vars]
SUPABASE_URL = "https://fdaysgypgzyexilqfyrx.supabase.co"
SUPABASE_KEY = "sb_publishable_GAe1m_PFF3WV_Cp2vv5h-A_ca3ANUms"
# Google accounts allowed to open the stats page at /admin (comma-separated)
ADMIN_EMAILS = "jonnycosmopoker@gmail.com"
# The Shop (worker/pay.js): "1" opens it to everyone (until then only the owner sees it); STRIPE_INVOICES "1" adds Stripe invoices (0.4% each).
# The Stripe keys are never here: STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are Cloudflare secrets (Settings > Variables and Secrets, type Secret).
SHOP_OPEN = "0"
STRIPE_INVOICES = "0"

# The game page, pictures and badges. Requests that match no file go to the worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "TABLE"
class_name = "Table"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Table", "Lobby", "Accounts"]
